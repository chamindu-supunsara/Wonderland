name: Milestone checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/catalog/requirements*.txt
      - run: python -m pip install -r services/catalog/requirements-dev.txt
      - run: bash scripts/ci/install-helm.sh
      - run: python scripts/ci/check_source.py
      - run: docker compose up -d postgres --wait
      - run: docker compose run --rm booking-bootstrap
      - run: docker compose run --rm events-bootstrap
      - run: docker compose run --rm payment-bootstrap
      - run: docker compose run --rm admission-bootstrap
      - run: docker compose run --rm reporting-bootstrap
      - run: python -m ruff check services/catalog services/booking services/payment services/admission services/analytics packages/common/wonderland_events tests
      - run: python -m ruff format --check services/catalog services/booking services/payment services/admission services/analytics packages/common/wonderland_events tests
      - run: python -m pytest --tb=short --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/python.xml
          retention-days: 7
      - if: failure()
        run: docker compose logs postgres
      - if: always()
        run: docker compose down
  angular:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx --yes npm@11.6.2 ci
      - run: npm test
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap foundation workloads routing analytics; do
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false
            terraform -chdir="infra/terraform/$root" validate
          done
