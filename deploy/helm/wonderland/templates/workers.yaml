{{- if .Values.enabled }}
{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $name }}}
  template:
    metadata:
      annotations:
        checksum/runtime: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
      labels: {app: {{ $.Release.Name }}-{{ $name }}, component: worker}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: {{ include "wonderland.image" (dict "root" $ "service" $worker.service) | quote }}
          command: {{ $worker.command | toJson }}
          env:
            - {name: WORKER_HEARTBEAT_ENABLED, value: 'true'}
            {{- range $key, $value := $worker.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          envFrom:
            - configMapRef: {name: {{ $.Release.Name }}-runtime}
            - secretRef: {name: {{ index $.Values.secrets $worker.service }}}
          securityContext:
            {{- include "wonderland.security" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            exec: {command: [python, -m, wonderland_events.health]}
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec: {command: [python, -m, wonderland_events.health]}
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [python, -m, wonderland_events.health]}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
{{- end }}
{{- end }}
{{- end }}
